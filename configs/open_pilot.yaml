# Phase 11 open-system pilot config (TZ Section 21).
#
# STATUS: approved for Milestone 3 (user decision, 2026-08-14, [A35]
# resolution addendum in docs/assumptions.md).
#
# [A35]: at gamma_tilde=0.05 (gamma=0.1, omega_ref=2), Hebbian weight
# movement nearly freezes on BOTH the lattice and Active (~10-12x smaller
# weight std than the closed C0 baseline). User chose option (c):
# proceed with this gamma_tilde AS IS and treat a near-zero D_W /
# no-separation-from-C0 result as itself informative
# (OPEN_DYNAMICS_NO_EFFECT, TZ Section 16) rather than re-parameterizing.
# If the factorial cells show no separation, read this as "gamma=0.1
# suppressed adaptation before openness could act", NOT as "openness
# cannot create geometric organization" -- those are different claims.
#
# [A36]: G1 has ~zero resolving power at N=64 -- it only cleanly
# separates lattice from ER at N=512. User chose N=512 for this reason
# (sizes below was [64, 512] while the scale was undecided).

sizes: [512]
seeds_per_cell: 5

open_dynamics:
  gamma_tilde_levels: [0.05]
  sigma_tilde_levels: [0.05]
  omega_ref: 2.0

pilot:
  dt: 0.05
  k: 50
  dtau_steps: 50
  eta: 0.1
